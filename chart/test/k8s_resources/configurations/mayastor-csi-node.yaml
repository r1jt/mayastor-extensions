        - --nvme-core-io-timeout=110s10s
        - --nvme-ctrl-loss-tmo=1980
        - --nvme-nr-io-queues=2
        - --nvme-connect-fallback=true
        - --kubelet-path=/var/lib/kubelet
        - --node-selector=openebs.io/csi-node=mayastor
        - --fmt-style=pretty
        - --ansi-colors=true
        env:
        - name: RUST_LOG
          value: info
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: RUST_BACKTRACE
          value: '1'
        image: docker.io/openebs/mayastor-csi-node:develop
        imagePullPolicy: Always
        name: csi-node
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          privileged: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /dev
