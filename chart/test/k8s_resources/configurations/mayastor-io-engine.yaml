  name: mayastor-io-engine
  namespace: mayastor
  resourceVersion: '747432'
  uid: 467eb07a-824e-42eb-b0d1-5e74bfb4f294
spec:
  minReadySeconds: 10
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: io-engine
      openebs.io/release: mayastor
  template:
    metadata:
      labels:
        app: io-engine
        openebs.io/logging: 'true'
        openebs.io/release: mayastor
        openebs.io/version: 0.0.0
    spec:
      containers:
      - args:
        - --fmt-style=pretty
        - --ansi-colors=true
        env:
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        image: docker.io/openebs/mayastor-metrics-exporter-io-engine:develop
        imagePullPolicy: Always
        name: metrics-exporter-io-engine
        ports:
        - containerPort: 9502
          name: metrics
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      - args:
        - --grpc-ip=$(MY_POD_IP)
        - -N$(MY_NODE_NAME)
        - -Rhttps://mayastor-agent-core:50051
        - -y/var/local/mayastor/io-engine/config.yaml
        - -l1,2
        - -p=mayastor-etcd:2379
        - --ptpl-dir=/var/local/mayastor/io-engine/ptpl/
        - --api-versions=v1
        - --tgt-crdt=30
        - --events-url=nats://mayastor-nats:4222
        - --ps-retries=300
        command:
        - io-engine
        env:
        - name: RUST_LOG
          value: info
        - name: NVMF_TCP_MAX_QPAIRS_PER_CTRL
          value: '32'
        - name: NVMF_TCP_MAX_QUEUE_DEPTH
          value: '32'
        - name: NVME_TIMEOUT
          value: 110s
        - name: NVME_TIMEOUT_ADMIN
          value: 30s
        - name: NVME_KATO
          value: 10s
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: NEXUS_NVMF_ANA_ENABLE
          value: '1'
        - name: NEXUS_NVMF_RESV_ENABLE
          value: '1'
        image: docker.io/openebs/mayastor-io-engine:develop
        imagePullPolicy: Always
        name: io-engine
        ports:
        - containerPort: 10124
          name: io-engine
          protocol: TCP
        resources:
          limits:
            cpu: '2'
            hugepages-2Mi: 2Gi
            memory: 1Gi
          requests:
            cpu: '2'
            hugepages-2Mi: 2Gi
            memory: 1Gi
        securityContext:
          privileged: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /dev
          name: device
        - mountPath: /run/udev
          name: udev
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /var/local/mayastor/io-engine/
          name: configlocation
        - mountPath: /dev/hugepages
          name: hugepage
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      initContainers:
      - command:
        - sh
        - -c
        - trap "exit 1" TERM; until nc -vzw 5 mayastor-agent-core 50051; do date; echo "Waiting for agent-core-grpc services..."; sleep 1; done;
        image: docker.io/openebs/alpine-sh:4.1.0
        imagePullPolicy: IfNotPresent
        name: agent-core-grpc-probe
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      - command:
        - sh
        - -c
        - trap "exit 1" TERM; until nc -vzw 5 mayastor-etcd 2379; do date; echo "Waiting for etcd..."; sleep 1; done;
        image: docker.io/openebs/alpine-sh:4.1.0
        imagePullPolicy: IfNotPresent
        name: etcd-probe
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      nodeSelector:
        kubernetes.io/arch: amd64
        openebs.io/engine: mayastor
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: mayastor-service-account
      serviceAccountName: mayastor-service-account
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /dev
          type: Directory
        name: device
      - hostPath:
          path: /run/udev
          type: Directory
        name: udev
      - emptyDir:
          medium: Memory
          sizeLimit: 1Gi
        name: dshm
      - emptyDir:
          medium: HugePages
        name: hugepage
      - hostPath:
          path: /var/local/mayastor/io-engine/
          type: DirectoryOrCreate
        name: configlocation
  updateStrategy:
    type: OnDelete
status:
  currentNumberScheduled: 2
  desiredNumberScheduled: 2
  numberAvailable: 2
  numberMisscheduled: 0
  numberReady: 2
  observedGeneration: 1
  updatedNumberScheduled: 2
