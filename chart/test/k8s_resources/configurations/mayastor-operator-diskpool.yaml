  uid: 1d726355-1570-4e46-af59-8c1d6051ca77
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: operator-diskpool
      openebs.io/release: mayastor
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: operator-diskpool
        openebs.io/logging: 'true'
        openebs.io/release: mayastor
        openebs.io/version: 0.0.0
    spec:
      containers:
      - args:
        - -e http://mayastor-api-rest:8081
        - -nmayastor
        - --request-timeout=5s
        - --interval=30s
        - --ansi-colors=true
        - --fmt-style=pretty
        env:
        - name: RUST_LOG
          value: info
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        image: docker.io/openebs/mayastor-operator-diskpool:develop
        imagePullPolicy: Always
        name: operator-diskpool
        resources:
          limits:
            cpu: 100m
            memory: 32Mi
          requests:
            cpu: 50m
            memory: 16Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - trap "exit 1" TERM; until nc -vzw 5 mayastor-agent-core 50051; do date; echo "Waiting for agent-core-grpc services..."; sleep 1; done;
        image: docker.io/openebs/alpine-sh:4.1.0
        imagePullPolicy: IfNotPresent
        name: agent-core-grpc-probe
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      - command:
        - sh
        - -c
        - trap "exit 1" TERM; until nc -vzw 5 mayastor-etcd 2379; do date; echo "Waiting for etcd..."; sleep 1; done;
        image: docker.io/openebs/alpine-sh:4.1.0
        imagePullPolicy: IfNotPresent
        name: etcd-probe
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      nodeSelector:
        kubernetes.io/arch: amd64
      priorityClassName: mayastor-cluster-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: mayastor-service-account
      serviceAccountName: mayastor-service-account
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoExecute
        key: node.kubernetes.io/unreachable
        operator: Exists
        tolerationSeconds: 5
      - effect: NoExecute
        key: node.kubernetes.io/not-ready
        operator: Exists
        tolerationSeconds: 5
