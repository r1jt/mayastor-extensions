  name: mayastor-csi-controller
  namespace: mayastor
  resourceVersion: '747387'
  uid: eca123c3-4a63-44a0-8a8e-055b2926759e
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: csi-controller
      openebs.io/release: mayastor
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: csi-controller
        openebs.io/logging: 'true'
        openebs.io/release: mayastor
        openebs.io/version: 0.0.0
    spec:
      containers:
      - args:
        - --v=2
        - --csi-address=$(ADDRESS)
        - --feature-gates=Topology=true
        - --strict-topology=false
        - --default-fstype=ext4
        - --extra-create-metadata
        - --timeout=36s
        - --worker-threads=10
        - --prevent-volume-mode-conversion
        env:
        - name: ADDRESS
          value: /var/lib/csi/sockets/pluginproxy/csi.sock
        image: registry.k8s.io/sig-storage/csi-provisioner:v3.5.0
        imagePullPolicy: IfNotPresent
        name: csi-provisioner
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/csi/sockets/pluginproxy/
          name: socket-dir
      - args:
        - --v=2
        - --timeout=36s
        - --csi-address=$(ADDRESS)
        env:
        - name: ADDRESS
          value: /var/lib/csi/sockets/pluginproxy/csi.sock
        image: registry.k8s.io/sig-storage/csi-attacher:v4.3.0
        imagePullPolicy: IfNotPresent
        name: csi-attacher
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/csi/sockets/pluginproxy/
          name: socket-dir
      - args:
        - --v=2
        - --csi-address=$(ADDRESS)
        env:
        - name: ADDRESS
          value: /var/lib/csi/sockets/pluginproxy/csi.sock
        image: registry.k8s.io/sig-storage/csi-snapshotter:v6.3.3
        imagePullPolicy: IfNotPresent
        name: csi-snapshotter
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/csi/sockets/pluginproxy/
          name: socket-dir
      - args:
        - --v=2
        - --leader-election=false
        - --prevent-volume-mode-conversion
        image: registry.k8s.io/sig-storage/snapshot-controller:v6.3.3
        imagePullPolicy: IfNotPresent
        name: csi-snapshot-controller
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      - args:
        - --v=2
        - --csi-address=$(ADDRESS)
        - --handle-volume-inuse-error=false
        env:
        - name: ADDRESS
          value: /var/lib/csi/sockets/pluginproxy/csi.sock
        image: registry.k8s.io/sig-storage/csi-resizer:v1.9.3
        imagePullPolicy: IfNotPresent
        name: csi-resizer
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/csi/sockets/pluginproxy/
          name: socket-dir
      - args:
        - --csi-socket=/var/lib/csi/sockets/pluginproxy/csi.sock
        - --rest-endpoint=http://mayastor-api-rest:8081
        - --node-selector=openebs.io/csi-node=mayastor
        - --ansi-colors=true
        - --fmt-style=pretty
        - --create-volume-limit=10
        env:
        - name: RUST_LOG
          value: info
        image: docker.io/openebs/mayastor-csi-controller:develop
        imagePullPolicy: Always
        name: csi-controller
        resources:
          limits:
            cpu: 32m
            memory: 128Mi
          requests:
            cpu: 16m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/csi/sockets/pluginproxy/
          name: socket-dir
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      initContainers:
      - command:
        - sh
        - -c
        - trap "exit 1" TERM; until nc -vzw 5 mayastor-api-rest 8081; do date; echo "Waiting for REST API endpoint to become available"; sleep 1; done;
        image: docker.io/openebs/alpine-sh:4.1.0
        imagePullPolicy: IfNotPresent
        name: api-rest-probe
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      nodeSelector:
        kubernetes.io/arch: amd64
      priorityClassName: mayastor-cluster-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: mayastor-service-account
      serviceAccountName: mayastor-service-account
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoExecute
        key: node.kubernetes.io/unreachable
        operator: Exists
        tolerationSeconds: 5
      - effect: NoExecute
        key: node.kubernetes.io/not-ready
        operator: Exists
        tolerationSeconds: 5
      volumes:
      - emptyDir: {}
        name: socket-dir
