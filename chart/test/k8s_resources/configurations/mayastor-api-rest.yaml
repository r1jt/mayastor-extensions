  name: mayastor-api-rest
  namespace: mayastor
  resourceVersion: '747351'
  uid: ad3d6974-94fa-4b87-a5dd-5c419715ee1f
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: api-rest
      openebs.io/release: mayastor
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: api-rest
        openebs.io/logging: 'true'
        openebs.io/release: mayastor
        openebs.io/version: 0.0.0
    spec:
      containers:
      - args:
        - --dummy-certificates
        - --no-auth
        - --http=[::]:8081
        - --request-timeout=5s
        - --core-grpc=https://mayastor-agent-core:50051
        - --ansi-colors=true
        - --fmt-style=pretty
        - --core-health-freq=20s
        env:
        - name: RUST_LOG
          value: info
        image: docker.io/openebs/mayastor-api-rest:develop
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 1
          httpGet:
            path: /live
            port: 8081
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: api-rest
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8081
          protocol: TCP
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /ready
            port: 8081
            scheme: HTTP
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - trap "exit 1" TERM; until nc -vzw 5 mayastor-agent-core 50051; do date; echo "Waiting for agent-core-grpc services..."; sleep 1; done;
        image: docker.io/openebs/alpine-sh:4.1.0
        imagePullPolicy: IfNotPresent
        name: agent-core-grpc-probe
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      - command:
        - sh
        - -c
        - trap "exit 1" TERM; until nc -vzw 5 mayastor-etcd 2379; do date; echo "Waiting for etcd..."; sleep 1; done;
        image: docker.io/openebs/alpine-sh:4.1.0
        imagePullPolicy: IfNotPresent
        name: etcd-probe
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      nodeSelector:
        kubernetes.io/arch: amd64
      priorityClassName: mayastor-cluster-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoExecute
        key: node.kubernetes.io/unreachable
        operator: Exists
        tolerationSeconds: 5
      - effect: NoExecute
        key: node.kubernetes.io/not-ready
        operator: Exists
        tolerationSeconds: 5
